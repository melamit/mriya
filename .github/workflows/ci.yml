name: CI

on:
  pull_request:
  push:

permissions: {}

jobs:
  format:
    runs-on: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm install --frozen-lockfile
      - run: npm run fmt:check
