name: CI

on:
  pull_request:
  push:

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint:fix
      - run: npm run fmt:check
